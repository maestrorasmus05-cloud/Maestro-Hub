        document.getElementById('chProgressTxt').textContent = `${doneCount}/${CHALLENGES.length}`;
        document.getElementById('chProgress').innerHTML = `<div class="ch-prog"><b>${earned}</b>/${maxPts} pts · ${doneCount}/${CHALLENGES.length} done</div><div class="mini-bar"><i style="width:${Math.round(earned / maxPts * 100)}%"></i></div>`;
        document.getElementById('chList').innerHTML = CHALLENGES.map(c => `<li data-ch="${c.id}" class="${proj.challenge === c.id ? 'active' : ''}"><span>${doneMap[c.id] ? '✓ ' : ''}${c.title}</span><em class="lvl ${c.level}">${c.level[0]}</em></li>`).join('');
        if (window.innerWidth > 800 || proj.challenge) document.getElementById('chDetails').open = window.innerWidth > 800;
        document.getElementById('chList').addEventListener('click', e => {
          const li = e.target.closest('[data-ch]'); if (!li) return;
          try { persist(); } catch {}
          const c = CHALLENGES.find(x => x.id === li.dataset.ch);
          let p = projects.find(x => x.challenge === c.id);
          if (!p) { p = { id: 'p_' + Date.now(), name: 'Challenge: ' + c.title, html: c.starter.html, css: c.starter.css, js: c.starter.js, challenge: c.id, updated: new Date().toISOString() }; projects.unshift(p); saveProjects(projects); }
          activeId = p.id; paint();

          document.getElementById('chCheckBtn').addEventListener('click', () => {
            const v = getVals(); const S = { html: v.html, css: v.css, js: v.js, all: v.html + '\n' + v.css + '\n' + v.js };
            const lis = box.querySelectorAll('#chChecks li'); let pass = 0;
            ch.checks.forEach((c, i) => { let ok = false; try { ok = !!c[1](S); } catch {} if (ok) pass++; lis[i].dataset.state = ok ? 'ok' : 'bad'; lis[i].querySelector('.dot').textContent = ok ? '✓' : '✗'; });
            runPreview();
            if (pass === ch.checks.length) {
              const d = loadChallengeDone(); const first = !d[ch.id];
              if (first) { d[ch.id] = { date: new Date().toISOString() }; saveChallengeDone(d); }
              persist(); paint();
              toast(first ? '🎉 Challenge complete! +' + ch.pts + ' pts' : 'Challenge already completed ✓');
            } else toast(pass + '/' + ch.checks.length + ' requirements met — keep going!');
          });
        }
        // ---- mobile: one editor at a time ----
        const mt = document.getElementById('labMTabs');
        const showPane = n => {
          document.querySelectorAll('.lab-editors > [data-pane]').forEach(el => el.classList.toggle('show', el.dataset.pane === n));
          mt.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.p === n));
        };
        mt.addEventListener('click', e => { const b = e.target.closest('button'); if (b) showPane(b.dataset.p); });
        showPane('html');
        document.getElementById('runBtn').addEventListener('click', () => { if (window.matchMedia('(max-width: 800px)').matches) showPane('preview'); });
        runPreview();
      };
      paint();
    }


    async function generateCertificateCanvas(name) {
      const loadImg = (src, cors) => new Promise((resolve, reject) => {
        const im = new Image();
        if (cors) im.crossOrigin = 'anonymous';
        im.onload = () => resolve(im); im.onerror = reject; im.src = src;
      });
      let img;
      const isHttp = /^https?:$/.test(location.protocol);
      try { if (!isHttp) throw 0; img = await loadImg(CERT_TEMPLATE, true); }
      catch (e) { img = await loadImg(CERT_TEMPLATE_EMBEDDED, false); } // file:// or missing file: same template, embedded
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      // Recipient name: same name collected at sign-up / guest login
      const display = (name || 'Learner').trim();
      const cx = canvas.width / 2;
      // Blank band between blue banner and "has successfully completed…"
      const nameY = canvas.height * 0.462;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Scale font for long/short names
      let fontSize = Math.min(64, Math.max(32, Math.floor(canvas.width / (Math.max(display.length, 10) * 0.62))));
      ctx.font = 'italic ' + fontSize + 'px "Great Vibes", "Segoe Script", "Brush Script MT", cursive';
      let metrics = ctx.measureText(display);
      const maxWidth = canvas.width * 0.72;
      while (metrics.width > maxWidth && fontSize > 28) {
        fontSize -= 2;
        ctx.font = 'italic ' + fontSize + 'px "Great Vibes", "Segoe Script", "Brush Script MT", cursive';
        metrics = ctx.measureText(display);
      }

      // The template image says "HTML, CSS & JavaScript courses"; repaint that one line for this course.
      ctx.save();
      {
        const k = canvas.width / 1168;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(235 * k, 432 * k, 700 * k, 34 * k);
        ctx.fillStyle = '#0B1F4A';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '500 ' + Math.round(22 * k) + 'px "Times New Roman", Georgia, serif';
        ctx.fillText('has successfully completed the Responsive Web Design course at', cx, 449 * k);
      }
      ctx.restore();

      // Navy ink matching certificate design
      ctx.fillStyle = '#0B1F4A';
      ctx.fillText(display, cx, nameY);
      return canvas;
    }

    async function renderCertificate() {
      const stats = getOverallStats();
      const main = document.getElementById('mainContent');
      const name = displayName();
      if (!stats.allQuizzesDone) {
        const total = stats.totalLessons, done = stats.quizzesTaken, left = total - done;
        const pct = Math.round((done / total) * 100), remainPct = 100 - pct;
        const todo = COURSES.filter(c => !progress[c.id]?.attempted);
        main.innerHTML = `
          <h1 class="page-title">Certificate</h1>
          <p class="page-sub">Complete every timed quiz to unlock your certificate. Your name will appear exactly as at sign-up.</p>
          <div class="cert-locked">
            <div class="ring" id="certRing" style="--p:0"><span><b id="certPct">0%</b><small>complete</small></span></div>
            <div class="cert-count">
              <div class="big"><span id="certRemain">100</span>% to go</div>
              <div class="sub">${left} ${left === 1 ? 'quiz' : 'quizzes'} left · ${done}/${total} taken</div>
              <div class="mini-bar"><i id="certBar" style="width:0%"></i></div>
              <div class="sub" style="margin-top:8px">${stats.quizzesTaken ? 'Average score so far: <b>' + stats.avg + '%</b>' : 'Take your first quiz to start the countdown.'}</div>
            </div>
          </div>
          <h3 style="margin:22px 0 10px">Still to do</h3>
          <div class="todo-list">${todo.map(c => `<a class="todo" href="#/quiz/${c.id}"><span>${c.title}</span><em>${c.quiz.questions.length} Qs · ${Math.round(c.quiz.timeLimitSec / 60)} min →</em></a>`).join('')}</div>`;
        // animated countdown: remaining % ticks down from 100 while the ring fills
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const ring = document.getElementById('certRing'), remEl = document.getElementById('certRemain'), pctEl = document.getElementById('certPct'), bar = document.getElementById('certBar');
        const t0 = performance.now(), dur = reduce ? 1 : 900;
        const step = now => {
          const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
          if (!document.getElementById('certRing')) return;
          const cur = Math.round(pct * e);
          ring.style.setProperty('--p', cur); pctEl.textContent = cur + '%'; bar.style.width = cur + '%';
          remEl.textContent = 100 - cur;
          if (t < 1) requestAnimationFrame(step); else remEl.textContent = remainPct;
        };
        requestAnimationFrame(step);
        return;
      }
      main.innerHTML = '<div class="cert-page"><h1 class="page-title">Your Certificate</h1><p class="page-sub">Awarded to <strong>' + name + '</strong> · Overall score <strong>' + stats.avg + '%</strong></p><div class="cert-preview-wrap"><canvas id="certCanvas"></canvas></div><div class="cert-actions"><button class="btn btn-primary" id="dlCertBtn" style="width:auto">Download certificate (PNG)</button><a href="#/" class="btn btn-ghost">Back</a></div></div>';
      try {
        const canvas = await generateCertificateCanvas(name);
        const host = document.getElementById('certCanvas');
        host.width = canvas.width; host.height = canvas.height;
        host.getContext('2d').drawImage(canvas, 0, 0);
        document.getElementById('dlCertBtn').addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'CodingHub-Certificate-' + name.replace(/\s+/g, '-') + '.png';
          a.click();
          toast('Certificate downloaded');
        });
      } catch (err) {
        main.querySelector('.cert-preview-wrap').innerHTML = '<p style="padding:40px;color:var(--red)">Could not load certificate-template.jpg</p>';
        console.error(err);
      }
    }

function renderAI() {
      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <h1 class="page-title">AI Check</h1>
        <p class="page-sub">Paste code or an answer. The free Google Gemini API will review it for correctness, style, and possible issues.</p>
        <div class="ai-panel">
          <h3>Code / Answer detector & feedback</h3>
          <textarea id="aiInput" placeholder="Paste HTML, CSS, JavaScript, or a written answer here..."></textarea>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" id="aiReviewBtn">Review with AI</button>
            <button class="btn btn-ghost" id="aiDetectBtn">Detect language / issues</button>
          </div>
          <div class="ai-result hidden" id="aiResult"></div>
        </div>
      `;
      const resultEl = document.getElementById('aiResult');
      const run = async (mode) => {
        const text = document.getElementById('aiInput').value.trim();
        if (!text) { toast('Paste something first'); return; }
        resultEl.classList.remove('hidden');
        resultEl.textContent = 'Thinking…';
        const prompt = mode === 'detect'
          ? `You are a coding tutor for beginners. Analyze this snippet. Reply with:\n1) Detected language\n2) Any syntax or logic issues\n3) One short improvement tip\n\nCode:\n${text}`
          : `You are a strict but helpful coding instructor. Review this student submission. Give:\n- Correctness (pass/fail style)\n- What is good\n- What to fix\n- A corrected version if needed (short)\n\nSubmission:\n${text}`;
        const out = await callGemini(prompt);
        resultEl.textContent = out;
      };
      document.getElementById('aiReviewBtn').addEventListener('click', () => run('review'));
      document.getElementById('aiDetectBtn').addEventListener('click', () => run('detect'));
    }

    function renderAdmin() {
      // Show app shell even if user is on login screen (admin is secret but must be reachable)
      const auth = document.getElementById('authScreen');
      const app = document.getElementById('app');
      if (auth) auth.style.display = 'none';
      if (app) app.classList.add('show');

      const main = document.getElementById('mainContent');
      if (!main) {
        console.error('mainContent missing');
        return;
      }
      const unlocked = sessionStorage.getItem('ch_admin') === '1';

      if (!unlocked) {
        main.innerHTML = `
          <div class="admin-gate">
            <h2 style="font-family:var(--display);font-weight:800;margin-bottom:8px">Admin</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:18px">Enter the secret password</p>
            <div class="form-group">
              <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" />
            </div>
            <button class="btn btn-primary" id="adminUnlock" type="button">Unlock</button>
            <p class="form-msg" id="adminMsg"></p>
            <p style="margin-top:16px;font-size:13px;color:var(--muted)"><a href="#/" style="color:var(--indigo);font-weight:600">← Back to app</a></p>
          </div>
        `;
        const tryUnlock = () => {
          const pass = (document.getElementById('adminPass') || {}).value || '';
          if (pass === ADMIN_PASSWORD) {
            sessionStorage.setItem('ch_admin', '1');
            renderAdmin();
          } else {
            const msg = document.getElementById('adminMsg');
            if (msg) { msg.className = 'form-msg err'; msg.textContent = 'Wrong password'; }
          }
        };
        document.getElementById('adminUnlock')?.addEventListener('click', tryUnlock);
        document.getElementById('adminPass')?.addEventListener('keydown', e => {
          if (e.key === 'Enter') tryUnlock();
        });
        return;
      }

      let studentRows = '';
      try {
        const users = JSON.parse(localStorage.getItem('ch_users') || '{}');
        Object.keys(users).forEach(email => {
          const key = 'ch_progress_' + email;
          const pr = JSON.parse(localStorage.getItem(key) || '{}');
          let scores = 0, possible = 0, taken = 0;
          Object.values(pr).forEach(prItem => {
            if (prItem.attempted) { taken++; scores += prItem.quizScore || 0; possible += prItem.quizTotal || 0; }
          });
          const avg = possible ? Math.round(scores / possible * 100) : 0;
          studentRows += '<li><span>' + (users[email].name || email) + '</span><span>' + taken + ' quizzes · ' + avg + '% avg</span></li>';
        });
      } catch (e) {}

      main.innerHTML = `
        <div class="admin-panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
            <h1 class="page-title" style="margin:0">Admin panel</h1>
            <div style="display:flex;gap:8px">
              <a href="#/" class="btn btn-ghost">Dashboard</a>
              <button class="btn btn-ghost" id="adminLock" type="button">Lock</button>
            </div>
          </div>
          <div class="admin-section">
            <h3>Lessons & quizzes</h3>
            <ul class="admin-list">
              ${COURSES.map(c => '<li><span>' + c.order + '. ' + c.title + '</span><span>' + c.quiz.questions.length + ' Q · ' + c.quiz.timeLimitSec + 's</span></li>').join('')}
            </ul>
            <p style="font-size:13px;color:var(--muted);margin-top:12px">To edit lessons, change the COURSES array in index.html and redeploy.</p>
          </div>
          <div class="admin-section">
            <h3>Registered students (local cache)</h3>
            <ul class="admin-list">
              ${studentRows || '<li><span>No local student records</span></li>'}
            </ul>
          </div>
          <div class="admin-section">
            <h3>Quick stats</h3>
            <p style="font-size:14px">Total lessons: <strong>${COURSES.length}</strong> (6 HTML + 6 CSS + 6 JS)</p>
            <p style="font-size:14px;margin-top:6px">Features: Code Lab, light/dark theme, certificates, Supabase auth.</p>
            <p style="font-size:14px;margin-top:6px">URL: <code>#/admin</code> · password in code as <code>ADMIN_PASSWORD</code>.</p>
          </div>
        </div>
      `;
      document.getElementById('adminLock')?.addEventListener('click', () => {
        sessionStorage.removeItem('ch_admin');
        location.hash = '#/';
      });
    }


    (async function boot() {
      try {
        if ((location.hash.slice(1) || '').split('/').filter(Boolean)[0] === 'admin') {
          renderAdmin();
          return;
        }
        // Restore guest session
        try {
          const gs = JSON.parse(localStorage.getItem('ch_session') || 'null');
          if (gs && (gs.mode === 'guest' || gs.name)) {
            enterApp(gs);
            return;
          }
        } catch {}
        // Optional Supabase session
        try {
          const client = await ensureSupabase();
          const { data: { session } } = await client.auth.getSession();
          if (session?.user) {
            const u = session.user;
            const name = u.user_metadata?.full_name || u.user_metadata?.name || u.email?.split('@')[0] || 'User';
            enterApp({ id: u.id, email: u.email, name });
            return;
          }
          client.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') stayOnAuth(); });
        } catch (e) {
          console.warn('Auth optional:', e.message || e);
        }
      } catch (e) { console.warn(e); }
      stayOnAuth();
    })();

    /* ========== PWA: service worker + Install App ========== */
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch(error => console.error('Service Worker registration failed:', error));
      });
    }

    let deferredInstallPrompt = null;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function isInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: minimal-ui)').matches ||
             window.navigator.standalone === true ||
             document.referrer.startsWith('android-app://');
    }
    function refreshInstallButtons() {
      const hide = isInstalled();          // already running as the installed app: no install UI
      const login = document.getElementById('installBtn');
      const top = document.getElementById('installBtnTop');
      if (login) login.hidden = hide;
      if (top) top.hidden = hide || !deferredInstallPrompt;   // top bar button only when the browser can prompt
    }
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      refreshInstallButtons();
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      refreshInstallButtons();
      toast('Coding Hub installed — open it from your apps / home screen.');
    });
    async function installApp() {
      if (isInstalled()) { toast('Coding Hub is already installed on this device.'); return; }
      if (!deferredInstallPrompt) {
        if (!window.isSecureContext) {
          alert('Installing needs the app to be opened over HTTPS (for example from GitHub Pages, Netlify, Vercel or Cloudflare Pages). A file opened from your computer cannot be installed.');
        } else if (isIOS) {
          alert('On iPhone/iPad: tap the Share button in Safari, then choose "Add to Home Screen".');
        } else {
          alert('Use your browser menu and choose "Install app" or "Add to Home Screen".');
        }
        return;
      }
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      promptEvent.prompt();
      try { await promptEvent.userChoice; } catch (e) {}
      refreshInstallButtons();
    }
    document.getElementById('installBtn')?.addEventListener('click', installApp);
    document.getElementById('installBtnTop')?.addEventListener('click', installApp);
    window.matchMedia('(display-mode: standalone)').addEventListener?.('change', refreshInstallButtons);
    refreshInstallButtons();
  </script>
